name: Verify preservation kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Verify byte-identical upstream snapshots
        run: npm run verify
      - name: Check materialization and overwrite protection
        run: npm test
      - name: Check distributable packages
        run: python scripts/package.py
